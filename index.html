<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>AI Arcade</title>
<meta name="description" content="Digital Heroes AI Arcade: quick games about what AI is and what it can do.">
<meta name="theme-color" content="#003473">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Arcade">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/mulish-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="tb-home" id="tbHome" hidden aria-label="Back to all games">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>
      Home
    </button>
    <div class="tb-title" id="tbTitle"><small>Digital Heroes</small>AI Arcade</div>
    <span class="tb-sp"></span>
    <button class="tb-btn" id="tbSound" aria-label="Sound on or off"></button>
    <img class="tb-logo" id="tbLogo" src="img/dh-logo.png" alt="Digital Heroes">
  </header>
  <main class="stage" id="stage"></main>
</div>

<script src="js/app.js"></script>
<!-- Games: add a new game file here and in sw.js. Each file calls Arcade.register({...}). -->
<script src="games/yours-or-mine.js"></script>
<script src="games/mind-the-gap-data.js"></script>
<script src="games/mind-the-gap.js"></script>
<script>Arcade.start();</script>
</body>
</html>
